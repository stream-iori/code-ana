# code-ana 用户配置草案 v1，建议保存到 ~/.code-ana/config.toml。
# 仅控制本机服务、资源和工具链映射；不存项目语言分析默认值。
# 以下数值仅演示 schema，不是已验证的容量或性能默认值。
schema_version = 1
kind = "user"

[daemon]
idle_timeout_seconds = 600

[limits]
max_workers = 2
max_worker_memory_bytes = 2147483648
max_total_worker_memory_bytes = 4294967296

# 每个别名有语言和本机绝对路径。启用示例前替换成真实安装路径。
# 分析项目可以用 toolchain = "jdk17"，但不能用它改 adapter 的构建工具链。
# [toolchains.jdk17]
# language = "java"
# home = "/absolute/path/to/jdk-17"

# [toolchains.rust_stable]
# language = "rust"
# home = "/absolute/path/to/rust-toolchain"

# CLI-daemon 固定采用 HTTP/2 + protobuf，建议 gRPC；这里不开放协议切换。
# endpoint/动态端口由 daemon 生成和登记，不在项目配置中指定。

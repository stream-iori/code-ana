# code-ana 多语言项目配置 schema 示例 v1，Rust 严格 schema 已实现；各语言/策略能力见 rust-first.md。
# 建议保存到 <project>/.code-ana/config.toml。
# 这是 Java + Rust 混合仓库示例；模块路径、features 应按项目修改。
# 字段、默认、优先级见 configuration.md；无旧配置兼容。
# 此示例展示 Java + 后续 Rust 请求形状；Rust adapter 未实现。可运行的 Java 8 示例见 examples/java-fixture-config.toml。
# Java 后端固定 javac，无解析器切换/回退；parse/analyze 禁用处理器。
# auto 工具链仅从用户登记的别名选唯一匹配 JDK，不回退 JAVA_HOME/PATH。

schema_version = 1
kind = "project"

[project]
name = "mixed-workspace"

[discovery]
mode = "explicit" # auto：仅发现显式启用语言内的模块；不自动选择语言

[scan]
scopes = ["MAIN", "TEST", "GENERATED"]
include = ["**"]
exclude = []
text_only = []

[build]
suggestions = true # 缺产物时返回外部构建建议；产品不执行目标项目编译

[index]
mode = "auto" # full：明确全量；auto：兼容时增量

[resources.index]
# 省略时使用服务预算；数值是申请上限，不是产品容量承诺。
# worker_memory_bytes = 2147483648 # 包含 host/原生库和目标 JDK 子进程
# java_compiler_heap_bytes = 134217728 # Java 8 javac 子进程堆，8–512 MiB
# java_parallelism = 8 # 1–8；显式设置须满足 host/JVM 堆与非堆空间预约，128 MiB 堆的 8 并行至少 2 GiB
# java_model_record_limit = 100000 # 每 context 的模型工作记录数，1–5000000
# java_model_archive_bytes = 67108864 # 每 context 临时/最终模型，64 KiB–1 GiB
# java_model_decode_bytes = 536870912 # 单 context 解码分配估算，64 KiB–2 GiB
# java_native_heap_bytes = 268435456 # Graal isolate 实际堆，8–2048 MiB、按 MiB 对齐
# java_compiler_timeout_seconds = 120 # 单 context javac，1–3600 秒
# java_result_bytes = 67108864 # 控制结果 / GRA1 行归档各自上限，64 KiB–8 GiB
# java_fact_limit = 100000 # 全任务事实/owner 数，1–5000000
# java_scratch_bytes = 2147483648 # 任务暂存总额，64 KiB–32 GiB；包含捕获副本和候选 SQLite

[resources.query]
diff_spill_bytes = 8388608 # 当前仅 schema 字段，未接入执行预算

[query]
scopes = ["ALL"] # 当前 TOML query 默认未应用；实际以 CLI/TaskRequest 为准
# max_output_bytes = 32768 # 当前仅 schema，查询以 CLI 参数为准

[observability]
mode = "basic"

[languages.java]
enabled = true
mode = "semantic"

[languages.java.discovery]
build_system = "maven" # auto / maven / plain；gradle 仅保留 schema，adapter 未支持
# inputs_manifest = ".code-ana/java-inputs.json" # auto 展开需外部 codeana-export-java-inputs 准备

[languages.java.analysis]
source_version = "auto" # 从模块构建声明解析；不是 adapter 的 Java 25 版本
toolchain = "auto" # 或用户配置中登记的 Java toolchain 别名
classpath = "existing"
vm_classpath = true # javac semantic 必需；false 拒绝

[languages.java.lombok]
mode = "off" # model：独立 Java 声明模型补全；不执行 Lombok 处理器
strict = false

[languages.java.extensions.spring]
enabled = true
xml = false

[languages.java.extensions.sofa]
enabled = true # 静态 SOFA XML 可独立于 Spring；不自动开启 Spring

[languages.java.external]
exclude_patterns = ["java.lang.*", "java.io.*", "java.net.*", "java.nio.*", "java.math.*", "sun.*", "com.sun.*", "jdk.*"]

[languages.rust]
enabled = true
mode = "semantic" # syntax：语法能力；semantic：需要已验证 crate graph/工具链

[languages.rust.discovery]
build_system = "cargo"

[languages.rust.analysis]
edition = "auto"
toolchain = "auto"

[[modules]]
id = "order-service"
language = "java"
root = "services/order"
manifest = "pom.xml" # 相对 module.root

[modules.analysis]
source_version = "8" # 当前产品只支持目标 Java 8；adapter 仍由 Java 25/GraalVM 构建

[modules.extensions.spring]
xml = true

[[modules.source_roots]]
path = "src/main/java" # 相对 module.root
scope = "MAIN"

[[modules.source_roots]]
path = "src/test/java"
scope = "TEST"

[[modules]]
id = "native-engine"
language = "rust"
root = "native/engine"
manifest = "Cargo.toml"

[[modules.worlds]]
id = "default"
target = "host" # 分析前解析为真实 target identity
default_features = true
features = []
cfg = []

[[modules.worlds]]
id = "fast"
target = "host"
default_features = true
features = ["fast"] # 示例；必须是目标项目合法的 feature 选择
cfg = []

[versions.capture]
include_ignored = []

[versions.gc]
auto = true
keep = 20
max_bytes = 0 # 0：不设置该项目字节预算；保护引用仍不能被强删
max_age_days = 30
include_caches = false # 当前 GC 不读取此字段，派生缓存另有配额/LRU

[search.text]
backend = "grep" # 当前不切换引擎，使用 Rust 匹配/可选 FTS
include = ["**/*.java", "**/*.rs", "**/*.xml", "**/*.toml", "docs/**/*.md"]

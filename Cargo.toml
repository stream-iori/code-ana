[workspace]
members = [
    "crates/contracts",
    "crates/cli",
    "crates/daemon",
    "crates/java-worker",
    "crates/rust-worker",
    "crates/model",
    "crates/config",
    "crates/storage",
    "crates/query",
    "crates/application",
    "crates/mock-worker",
    "lang-rust-adaptor",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1.47", features = ["full"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
prost = "0.14.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
libc = "0.2"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
globset = "0.4"
regex = "1"
walkdir = "2"
tempfile = "3"

# rust-analyzer's internal crates must be upgraded as one tested set.
ra_ap_hir = "=0.0.349"
ra_ap_ide_db = "=0.0.349"
ra_ap_base_db = "=0.0.349"
ra_ap_syntax = "=0.0.349"
ra_ap_vfs = "=0.0.349"
ra_ap_cfg = "=0.0.349"
ra_ap_intern = "=0.0.349"
ra_ap_span = "=0.0.349"

# SDK content verification hashes hundreds of MiB even in development gates.
[profile.dev.package.sha2]
opt-level = 3

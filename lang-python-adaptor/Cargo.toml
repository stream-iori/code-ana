[package]
name = "codeana-python-adaptor"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace]
resolver = "2"
members = ["worker"]

[dependencies]
anyhow = "1"
aho-corasick = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
codeana-model = { path = "../crates/model" }
codeana-contracts = { path = "../crates/contracts" }
pyrefly = { git = "https://github.com/facebook/pyrefly", rev = "feeee254e65844f23f973a0a29cae02d09931068", default-features = false }
pyrefly_build = { git = "https://github.com/facebook/pyrefly", rev = "feeee254e65844f23f973a0a29cae02d09931068" }
pyrefly_config = { git = "https://github.com/facebook/pyrefly", rev = "feeee254e65844f23f973a0a29cae02d09931068" }
pyrefly_python = { git = "https://github.com/facebook/pyrefly", rev = "feeee254e65844f23f973a0a29cae02d09931068" }
pyrefly_types = { git = "https://github.com/facebook/pyrefly", rev = "feeee254e65844f23f973a0a29cae02d09931068" }
pyrefly_util = { git = "https://github.com/facebook/pyrefly", rev = "feeee254e65844f23f973a0a29cae02d09931068" }
ruff_python_ast = "=0.0.14"
ruff_text_size = "=0.0.14"

[dev-dependencies]
codeana-query = { path = "../crates/query" }
codeana-storage = { path = "../crates/storage" }
rusqlite = { version = "0.40", features = ["bundled"] }

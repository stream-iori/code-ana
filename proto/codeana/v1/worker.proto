syntax = "proto3";
import "codeana/v1/graph.proto";
package codeana.worker.v1;
message Owner { string world = 1; string producer = 2; string kind = 3; string id = 4; }
message SourceUnit { string path = 1; string hash = 2; uint64 size = 3; string module = 4; string world = 5; string scope = 6; string language = 7; bool auxiliary = 8; }
message Manifest { repeated SourceUnit files = 1; }
message BuildContext { string language = 1; repeated string modules = 2; string source_version = 3; repeated string classpath = 4; string producer = 5; repeated string capabilities = 6; }
message BuildAdvice { repeated string missing = 1; string cwd = 2; repeated string argv = 3; string purpose = 4; repeated string expected = 5; string impact = 6; string retry = 7; string capture = 8; string module = 9; string world = 10; }
message Hello { uint32 protocol = 1; uint32 fact_ir = 2; string producer = 3; }
message JavaSource { SourceUnit unit = 1; string input = 2; bool publish = 3; }
message JavaContext {
 string id = 1; string module = 2; string world = 3; string scope = 4;
 repeated JavaSource sources = 5; repeated string classpath = 6; string digest = 7;
 string lombok = 8; bool spring = 9; bool spring_xml = 10; bool sofa = 11; repeated JavaSource resources = 12; bool lombok_strict = 13;
 repeated uint32 source_indices = 14; repeated uint32 publish_indices = 15;
 repeated uint32 classpath_indices = 16; repeated uint32 resource_indices = 17;
 uint32 model_record_limit = 18;
 uint64 model_archive_bytes = 19;
 bool prerequisite = 20;
 repeated string dependency_modules = 21;
 repeated string source_roots = 22;
 repeated string external_exclude_patterns = 23;
 bool external_policy_configured = 24;
 uint64 model_decode_bytes = 25;
}
enum JavaDependencyMode { RESOLVED = 0; SOURCE_ONLY_REQUESTED = 1; SOURCE_ONLY_FALLBACK = 2; }
message MavenDependencyFailure {
 string module = 1; string pom = 2; string coordinate = 3; string reason = 4; uint32 round = 5;
}
message JavaConfig {
 string java_home = 1; string toolchain_digest = 2; string bridge = 3;
 string scratch = 4; repeated JavaContext contexts = 5; string semantic_identity = 6;
 uint32 parallelism = 7;
 string cache_root = 8; bool signature_cache = 9;
 uint64 compiler_heap_bytes = 10;
 repeated JavaSource input_table = 11; repeated string classpath_table = 12; bool compact_inputs = 13;
 uint32 compiler_timeout_seconds = 14;
 uint64 native_heap_bytes = 15;
 uint64 result_bytes = 16;
 uint32 fact_limit = 17;
 JavaDependencyMode dependency_mode = 18;
 MavenDependencyFailure dependency_failure = 19;
}
message RustConfig { string input = 1; string sha256 = 2; uint64 bytes = 3; uint64 result_bytes = 4; uint64 fact_limit = 5; }
message Discover { Manifest manifest = 1; JavaConfig java = 2; RustConfig rust = 3; }
message Analyze { Manifest manifest = 1; string profile = 2; string baseline = 3; bool full = 4; reserved 5; bytes baseline_summary_json = 6; }
// Protocol 19: Begin/Chunk are provisional. Only a verified End permits candidate finalization.
message Begin { string mode = 1; string baseline = 2; string manifest = 3; string profile = 4; string producer = 5; repeated Owner replacements = 6; }
message Chunk { uint64 seq = 1; reserved 2; repeated codeana.graph.v1.Row rows = 3; }
message End { uint64 chunks = 1; uint64 count = 2; string checksum = 3; }
message Replan { string reason = 1; }
message Cancel {}
message Ack { string revision = 1; }
message Acked { string revision = 1; }
message Failure { string code = 1; string message = 2; }
message Envelope { reserved 14, 15; string attempt = 1; oneof body { Hello hello = 2; Discover discover = 3; BuildContext context = 4; Analyze analyze = 5; Begin begin = 6; Chunk chunk = 7; End end = 8; Replan replan = 9; Cancel cancel = 10; Ack ack = 11; Failure failure = 12; BuildAdvice advice = 13; Acked acked = 16; } }
